# 管理后台前端 - 本地开发 Docker Compose 配置
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aieducenter-admin-web-dev
    ports:
      - "3001:3001"
    environment:
      - BACKEND_URL=http://host.docker.internal:8081
    networks:
      - webnet

networks:
  webnet:
    external: true
